name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default to read-only. Each job opts into wider scopes if needed.
permissions:
  contents: read

# Cancel in-flight runs on the same branch/PR (keep main runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # CI-only values. Real secrets must never live in source.
      DATABASE_URL: postgresql://todo:todo@localhost:5432/todo?schema=public
      JWT_SECRET: ci-must-be-at-least-32-characters-long-xxxxxx
      CORS_ORIGINS: http://localhost:5173
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Informational: surface known CVEs in production deps. Non-blocking
        # because transitive issues can appear at any time and stalling all
        # PRs on an unfixable CVE is worse than visibility.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        # Verifies migration SQL is syntactically valid against a fresh DB
        # and prepares the schema for any tests added later.
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

  frontend:
    name: Frontend / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present
