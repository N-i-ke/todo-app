name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block PRs that introduce dependencies with a High/Critical CVE
          # or with a license outside the allow-list.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          allow-licenses: >-
            0BSD,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            CC0-1.0,
            ISC,
            MIT,
            MPL-2.0,
            Unlicense
